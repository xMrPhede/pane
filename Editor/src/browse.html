<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Same rule as index.html: loaded off disk into a WKWebView with no network, so the bundler
         inlines every byte. -->
    <title>Browse Notes</title>
    <style>__STYLES__</style>
  </head>
  <body>
    <!--
      The browse window: Pane's "Summon Browse Notes" hotkey. Search on top, the list on the left,
      the selected note rendered on the right with its Information block, and the action bar floating
      over the bottom edge. Everything it shows arrives from Swift; it never touches a file.
    -->
    <div class="browse" id="browse">
      <header class="browse__search">
        <button class="browse__back" id="back" aria-label="Close" tabindex="-1">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M10.25 2.75 5 8l5.25 5.25" fill="none" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <input
          class="browse__input"
          id="search"
          type="text"
          placeholder="Search notes..."
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          aria-controls="list"
        />
      </header>

      <div class="browse__body">
        <div class="browse__list" id="list" role="listbox" aria-label="Notes"></div>
        <div class="browse__empty" id="empty" hidden>
          <!-- Drawn at its own size rather than the row icon scaled up, whose stroke and fold
               doubled into a blot. -->
          <svg class="browse__empty-icon" width="34" height="40" viewBox="0 0 34 40" aria-hidden="true">
            <path d="M8.5 3.25h11.4c.73 0 1.43.29 1.95.8l7.6 7.6c.51.52.8 1.22.8 1.95V33.5a3.25 3.25 0 0 1-3.25 3.25H8.5a3.25 3.25 0 0 1-3.25-3.25v-27A3.25 3.25 0 0 1 8.5 3.25Z" />
            <path d="M20.25 3.5v6.75a2.5 2.5 0 0 0 2.5 2.5H29.5" />
            <path d="M11.5 20.5h11M11.5 25.5h11M11.5 30.5h6.5" />
          </svg>
          <div class="browse__empty-title" id="empty-title">No Notes</div>
          <div class="browse__empty-hint" id="empty-hint"></div>
        </div>
        <div class="browse__scroll-thumb" id="scroll-thumb" aria-hidden="true"></div>
        <div class="browse__divider" aria-hidden="true"></div>

        <section class="browse__detail" aria-label="Preview">
          <div class="browse__preview" id="preview"></div>
          <div class="browse__placeholder" id="placeholder" hidden></div>
          <div class="browse__info" id="info" hidden>
            <div class="browse__info-heading">Information</div>
            <div class="browse__info-row"><span>Title</span><span id="info-title"></span></div>
            <div class="browse__info-row"><span>Modified</span><span id="info-modified"></span></div>
            <div class="browse__info-row" id="info-created-row"><span>Created</span><span id="info-created"></span></div>
          </div>
        </section>
      </div>

      <footer class="browse__bar">
        <div class="browse__pill browse__pill--title">
          <img class="browse__app-icon" id="app-icon" alt="" />
          <span>Pane</span>
        </div>
        <div class="browse__pill browse__pill--actions">
          <button class="browse__bar-button browse__bar-button--primary" id="primary" tabindex="-1">
            <span id="primary-label">Open Note</span><kbd>↵</kbd>
          </button>
          <button class="browse__bar-button" id="actions-button" tabindex="-1">
            <span>Actions</span><kbd>⌘</kbd><kbd>K</kbd>
          </button>
        </div>
      </footer>

      <!-- ⌘K: what can be done to the selected note. Floats above the action bar it belongs to. -->
      <div class="browse__actions" id="actions" role="dialog" aria-label="Actions" hidden>
        <div class="browse__actions-list" id="actions-list" role="listbox"></div>
        <input
          class="browse__actions-search"
          id="actions-search"
          type="text"
          placeholder="Search for actions..."
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        />
      </div>

      <div class="browse__toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>

    <script>__SCRIPT__</script>
  </body>
</html>
